<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f6d"><title>英語をインストール</title><link rel="manifest" href="./manifest.webmanifest"><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#eef6fc;color:#17212b}.wrap{max-width:520px;margin:auto;padding:28px 18px;text-align:center}.card{background:#fff;border-radius:24px;padding:28px 20px;box-shadow:0 6px 24px #0001}.icon{font-size:64px}h1{margin:8px 0}.sub{color:#536474;line-height:1.7}.install{width:100%;min-height:62px;border:0;border-radius:17px;background:#123f6d;color:#fff;font-size:1.2rem;font-weight:800;margin-top:18px}.open{display:block;margin-top:18px;color:#123f6d}.hint{margin-top:16px;font-size:.9rem;color:#657786}</style></head><body><div class="wrap"><div class="card"><div class="icon">📘</div><h1>英語</h1><p class="sub">ホーム画面に「英語」をインストールします。<br>インストール後はブラウザではなく、ホーム画面のアイコンから起動できます。</p><button class="install" id="install">📲 英語をインストール</button><div id="msg" class="hint">ボタンを押すと端末のインストール確認が開きます。</div><a class="open" href="./">インストールせず英語を開く</a></div></div><script>let p=null,b=document.querySelector("#install"),m=document.querySelector("#msg");const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;function ready(){if(standalone()){location.replace("./");return}b.disabled=false;m.textContent=p?"「英語をインストール」を押してください。":"ボタンを押してください。インストール画面を呼び出せない場合は手順を表示します。"}window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();p=e;ready()});window.addEventListener("appinstalled",()=>{m.textContent="インストールできました。ホーム画面の「英語」から起動してください。";b.disabled=true;setTimeout(()=>location.replace("./"),1500)});b.onclick=async()=>{if(!p){m.innerHTML="このブラウザでは自動のインストール確認を呼び出せません。<br><b>Chromeで開き、右上︙ →「アプリをインストール」または「ホーム画面に追加」</b>を選んでください。";return}p.prompt();let r=await p.userChoice;if(r.outcome!=="accepted")m.textContent="インストールはキャンセルされました。";p=null;ready()};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").then(()=>setTimeout(ready,500));ready();</script></body></html>
